title: HENN open tools
description: Documentation for tools developed at HENN as research or one-offs.
theme: minima

# The guides are plain markdown with no front matter; these make Pages render them anyway
# and take each page's title from its first heading.
plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-readme-index
  
titles_from_headings:
  enabled: true
  strip_title: true
# Notes for whoever maintains the screenshots, not part of the guide.
exclude:
  - "**/images/README.md"
